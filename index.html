<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園許願池 - 靜態版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.30.0/dist/date-fns.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .masonry {
            column-count: 1;
            column-gap: 1rem;
        }
        @media (min-width: 768px) { .masonry { column-count: 2; } }
        @media (min-width: 1024px) { .masonry { column-count: 3; } }
        
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1rem;
        }

        .modal-enter { animation: modal-enter 0.3s ease-out; }
        @keyframes modal-enter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .emoji-picker-modal {
            display: none;
            position: absolute;
            bottom: 100%;
            right: 0;
            z-index: 100;
        }
        .emoji-picker-modal.active { display: block; }
    </style>
</head>
<body class="min-h-screen bg-amber-50 font-sans text-gray-900 pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-amber-100 px-4 py-4">
        <div class="max-w-5xl mx-auto flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="bg-amber-400 p-2 rounded-2xl shadow-lg shadow-amber-200">
                        <i data-lucide="sparkles" class="w-6 h-6 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-black tracking-tight text-amber-900">校園許願池</h1>
                </div>
                <button onclick="openModal()" class="bg-amber-400 hover:bg-amber-500 text-white p-3 rounded-2xl shadow-lg shadow-amber-200 transition-all active:scale-95 flex items-center gap-2 font-bold">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    <span class="hidden sm:inline">許下願望</span>
                </button>
            </div>

            <!-- Dashboard Stats & Filters -->
            <div class="flex flex-col gap-4">
                <div class="flex flex-wrap gap-4 items-center justify-between">
                    <div class="flex gap-2 items-center">
                        <span class="text-xs font-black text-amber-900/30 uppercase tracking-widest mr-2 flex items-center gap-1">
                            <i data-lucide="filter" class="w-3 h-3"></i> 狀態
                        </span>
                        <div id="status-filters" class="flex gap-1 bg-amber-100/50 p-1 rounded-xl">
                            <button onclick="setStatusFilter('全部')" class="status-btn px-3 py-1.5 rounded-lg text-xs font-black transition-all uppercase tracking-wider flex items-center gap-1.5 bg-white text-amber-900 shadow-sm" data-filter="全部">
                                全部 <span class="bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-md text-[10px]" id="count-total">0</span>
                            </button>
                            <button onclick="setStatusFilter('active')" class="status-btn px-3 py-1.5 rounded-lg text-xs font-black transition-all uppercase tracking-wider flex items-center gap-1.5 text-amber-900/40" data-filter="active">
                                進行中 <span class="bg-amber-900/5 text-amber-900/40 px-1.5 py-0.5 rounded-md text-[10px]" id="count-active">0</span>
                            </button>
                            <button onclick="setStatusFilter('done')" class="status-btn px-3 py-1.5 rounded-lg text-xs font-black transition-all uppercase tracking-wider flex items-center gap-1.5 text-amber-900/40" data-filter="done">
                                已實現 <span class="bg-amber-900/5 text-amber-900/40 px-1.5 py-0.5 rounded-md text-[10px]" id="count-done">0</span>
                            </button>
                        </div>
                    </div>

                    <div class="hidden md:flex gap-4 text-[10px] font-bold uppercase tracking-widest text-amber-900/40">
                        <div class="flex items-center gap-1.5">
                            <div class="w-1.5 h-1.5 rounded-full bg-amber-400"></div>
                            <span>進行中: <span class="text-amber-900" id="stat-active">0</span></span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <div class="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>
                            <span>已實現: <span class="text-amber-900" id="stat-done">0</span></span>
                        </div>
                        <div class="border-l border-amber-200 h-3 mx-1"></div>
                        <div class="flex items-center gap-1.5">
                            <span>總數: <span class="text-amber-900" id="stat-total">0</span></span>
                        </div>
                    </div>
                </div>

                <!-- Categories -->
                <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" id="category-filters">
                    <!-- Categories will be rendered here -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        <div id="wishes-list" class="masonry">
            <!-- Wishes will be rendered here -->
        </div>
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-amber-900/40 text-center">
            <i data-lucide="sparkles" class="w-16 h-16 mb-4 opacity-20"></i>
            <p class="text-lg font-medium">還沒有符合條件的願望呢，快來許一個吧！</p>
        </div>
    </main>

    <!-- Modal for Adding Wish -->
    <div id="add-modal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-4">
        <div onclick="closeModal()" class="absolute inset-0 bg-amber-900/20 backdrop-blur-sm"></div>
        <div class="relative modal-enter bg-white w-full max-w-lg rounded-t-[3rem] sm:rounded-[3rem] p-8 shadow-2xl flex flex-col gap-6">
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-black text-amber-900">許下一個願望</h2>
                <button onclick="closeModal()" class="p-2 hover:bg-amber-50 rounded-full transition-colors">
                    <i data-lucide="x" class="w-6 h-6 text-amber-900/30"></i>
                </button>
            </div>

            <form id="wish-form" class="flex flex-col gap-6">
                <div>
                    <label class="block text-xs font-black text-amber-900/40 uppercase tracking-widest mb-2">分類</label>
                    <div class="flex flex-wrap gap-2" id="modal-categories">
                        <!-- Category buttons set here -->
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black text-amber-900/40 uppercase tracking-widest mb-2">願望標題</label>
                    <div class="relative">
                        <input type="text" id="wish-title" placeholder="你想實現什麼？" required
                            class="w-full bg-amber-50 border-none rounded-2xl px-5 py-4 text-amber-900 placeholder:text-amber-900/20 focus:ring-2 focus:ring-amber-400 transition-all font-bold">
                        <div class="absolute right-2 top-1/2 -translate-y-1/2">
                            <button type="button" onclick="toggleEmojiPicker('title')" class="p-2 hover:bg-amber-100 rounded-xl text-amber-500 transition-colors">
                                <i data-lucide="smile" class="w-6 h-6"></i>
                            </button>
                            <div id="emoji-picker-title" class="emoji-picker-modal bg-white p-3 rounded-2xl shadow-2xl border border-amber-100 grid grid-cols-4 gap-2 w-48"></div>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black text-amber-900/40 uppercase tracking-widest mb-2">詳細描述</label>
                    <div class="relative">
                        <textarea id="wish-content" placeholder="描述一下你的願望吧..." rows="4" required
                            class="w-full bg-amber-50 border-none rounded-3xl px-5 py-4 text-amber-900 placeholder:text-amber-900/20 focus:ring-2 focus:ring-amber-400 transition-all font-bold resize-none"></textarea>
                        <div class="absolute right-2 bottom-4">
                            <button type="button" onclick="toggleEmojiPicker('content')" class="p-2 hover:bg-amber-100 rounded-xl text-amber-500 transition-colors">
                                <i data-lucide="smile" class="w-6 h-6"></i>
                            </button>
                            <div id="emoji-picker-content" class="emoji-picker-modal bg-white p-3 rounded-2xl shadow-2xl border border-amber-100 grid grid-cols-4 gap-2 w-48"></div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full py-5 bg-amber-400 hover:bg-amber-500 text-white rounded-3xl text-lg font-black shadow-xl shadow-amber-200 transition-all flex items-center justify-center gap-2 active:scale-95">
                    <i data-lucide="send" class="w-5 h-5"></i> 提交願望
                </button>
            </form>
        </div>
    </div>

    <!-- Modal for Adding Report/Update -->
    <div id="report-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div onclick="closeReportModal()" class="absolute inset-0 bg-amber-900/20 backdrop-blur-sm"></div>
        <div class="relative modal-enter bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl flex flex-col gap-6">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-black text-amber-900 flex items-center gap-2">
                    <i data-lucide="check-circle-2" class="w-6 h-6 text-amber-500"></i>
                    回報實現進度
                </h2>
                <button onclick="closeReportModal()" class="p-2 hover:bg-amber-50 rounded-full transition-colors font-bold">
                    <i data-lucide="x" class="w-6 h-6 text-amber-900/30"></i>
                </button>
            </div>

            <form id="report-form" class="flex flex-col gap-6">
                <input type="hidden" id="report-wish-id">
                <div class="relative">
                    <textarea id="report-content" placeholder="例如：已經借到參考書了！" rows="3" required
                        class="w-full bg-amber-50 border-none rounded-3xl px-5 py-4 text-amber-900 placeholder:text-amber-900/20 focus:ring-2 focus:ring-amber-400 transition-all font-bold resize-none"></textarea>
                    <div class="absolute right-2 bottom-4">
                        <button type="button" onclick="toggleEmojiPicker('report')" class="p-2 hover:bg-amber-100 rounded-xl text-amber-500 transition-colors">
                            <i data-lucide="smile" class="w-6 h-6"></i>
                        </button>
                        <div id="emoji-picker-report" class="emoji-picker-modal bg-white p-3 rounded-2xl shadow-2xl border border-amber-100 grid grid-cols-4 gap-2 w-48"></div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button type="button" onclick="closeReportModal()" class="flex-1 py-4 bg-gray-50 hover:bg-gray-100 text-gray-500 rounded-2xl font-bold transition-all">取消</button>
                    <button type="submit" class="flex-[2] py-4 bg-amber-400 hover:bg-amber-500 text-white rounded-2xl font-black shadow-lg shadow-amber-100 transition-all flex items-center justify-center gap-2">
                        提交回報
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- Configuration & Data ---
        // 🔴 請將這裡的網址換成你 Apps Script 部署後得到的 Web App URL
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxb4m3t0wmFoq2UpN6VL7AD8J0N5H1oZnxQKsa_w0mz6GldSwMTDA8zhCfYciJmBT8lQQ/exec";

        async function syncToSheet(payload) {
            if (APPS_SCRIPT_URL.includes("PASTE")) return;
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
            } catch (e) { console.warn(e); }
        }

        const CATEGORIES = [
            { label: '全部', icon: 'sparkles', color: 'bg-amber-100 text-amber-700' },
            { label: '學業', icon: 'book-open', color: 'bg-blue-100 text-blue-700' },
            { label: '交友', icon: 'users', color: 'bg-pink-100 text-pink-700' },
            { label: '生活', icon: 'coffee', color: 'bg-orange-100 text-orange-700' },
            { label: '校園設施', icon: 'building-2', color: 'bg-emerald-100 text-emerald-700' }
        ];
        const EMOJIS = ['✨', '🌟', '❤️', '🔥', '📚', '🎓', '🍕', '☕', '🌈', '💪', '🎉', '🍀', '💡', '🧸', '🐱', '🐶'];
        
        let currentStatusFilter = '全部';
        let currentCategoryFilter = '全部';
        let selectedModalCategory = '學業';

        // --- Core Functions (Required) ---
        
        function saveData(newRecord) {
            const records = loadData();
            records.unshift(newRecord);
            localStorage.setItem('records', JSON.stringify(records));
            syncToSheet({ action: "create", record: newRecord });
        }

        function loadData() {
            const data = localStorage.getItem('records');
            const records = data ? JSON.parse(data) : [];
            // Ensure every record has an updates array
            return records.map(r => ({ ...r, updates: r.updates || [] }));
        }

        function renderList() {
            try {
                const records = loadData();
                const listContainer = document.getElementById('wishes-list');
                const emptyState = document.getElementById('empty-state');
                
                // Filtering
                let filtered = records;
                if (currentCategoryFilter !== '全部') {
                    filtered = filtered.filter(r => r.category === currentCategoryFilter);
                }
                if (currentStatusFilter !== '全部') {
                    filtered = filtered.filter(r => r.status === currentStatusFilter);
                }

                // Sorting: active first, then done. Newest first within status.
                filtered.sort((a, b) => {
                    const dateA = new Date(a.createdAt).getTime();
                    const dateB = new Date(b.createdAt).getTime();
                    if (a.status === b.status) return dateB - dateA;
                    return a.status === 'active' ? -1 : 1;
                });

                // Stats Update
                const activeCount = records.filter(r => r.status === 'active').length;
                const doneCount = records.filter(r => r.status === 'done').length;
                const totalCount = records.length;

                document.getElementById('count-total').innerText = totalCount;
                document.getElementById('count-active').innerText = activeCount;
                document.getElementById('count-done').innerText = doneCount;
                document.getElementById('stat-total').innerText = totalCount;
                document.getElementById('stat-active').innerText = activeCount;
                document.getElementById('stat-done').innerText = doneCount;

                if (filtered.length === 0) {
                    listContainer.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                listContainer.innerHTML = filtered.map(r => {
                    const isDone = r.status === 'done';
                    const catInfo = CATEGORIES.find(c => c.label === r.category) || CATEGORIES[0];
                    
                    const d = new Date(r.createdAt);
                    const dateText = `${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;

                    // Render updates
                    const updatesHtml = r.updates && r.updates.length > 0 ? `
                        <div class="mb-6 space-y-3">
                            <div class="flex items-center gap-2 ${isDone ? 'text-gray-400' : 'text-amber-600'} mb-2">
                                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                                <span class="text-xs font-black uppercase tracking-widest">實現進度 (${r.updates.length})</span>
                            </div>
                            <div class="space-y-2">
                                ${r.updates.map(up => {
                                    const upd = new Date(up.createdAt);
                                    const updText = `${(upd.getMonth() + 1).toString().padStart(2, '0')}-${upd.getDate().toString().padStart(2, '0')} ${upd.getHours().toString().padStart(2, '0')}:${upd.getMinutes().toString().padStart(2, '0')}`;
                                    return `
                                        <div class="${isDone ? 'bg-gray-100/50 border-gray-200' : 'bg-amber-50/50 border-amber-100/50'} p-3 rounded-2xl border relative group/update text-left">
                                            <p class="text-sm font-medium pr-6 ${isDone ? 'text-gray-400' : 'text-amber-900/80'}">${up.content}</p>
                                            <p class="text-[10px] text-amber-900/30 mt-1 font-bold">
                                                ${updText}
                                            </p>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : '';

                    return `
                        <div class="masonry-item rounded-[2rem] p-6 mb-4 shadow-xl border transition-all relative group text-left ${isDone ? 'bg-gray-50 border-gray-200 shadow-none opacity-80' : 'bg-white border-amber-50 shadow-amber-100 hover:shadow-2xl'}">
                            <div class="flex items-center justify-between mb-4 pr-16">
                                <span class="px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider ${isDone ? 'bg-gray-200 text-gray-500' : catInfo.color}">
                                    ${r.category}
                                </span>
                                <span class="text-[10px] font-bold text-amber-900/30 flex items-center gap-1">
                                    <i data-lucide="clock" class="w-3 h-3"></i> ${dateText}
                                </span>
                            </div>

                            <div class="absolute top-4 right-4 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="toggleStatus('${r.id}')" class="p-2 rounded-full transition-all ${isDone ? 'text-amber-500 hover:bg-amber-50' : 'text-emerald-500 hover:bg-emerald-50'}" title="${isDone ? '標記為未實現' : '標記為已實現'}">
                                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteRecord('${r.id}')" class="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-full transition-all" title="刪除願望">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>

                            <h3 class="text-xl font-black mb-2 leading-tight transition-all ${isDone ? 'text-gray-400 line-through' : 'text-amber-900'}">${r.title}</h3>
                            <p class="text-sm leading-relaxed mb-6 whitespace-pre-wrap transition-all ${isDone ? 'text-gray-400' : 'text-amber-900/70'}">${r.content}</p>
                            
                            ${updatesHtml}

                            ${!isDone ? `
                                <button onclick="openReportModal('${r.id}')" class="w-full py-3 bg-amber-50 hover:bg-amber-100 text-amber-600 rounded-2xl text-sm font-black transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                                    實現進度回報
                                </button>
                            ` : `
                                <button onclick="toggleStatus('${r.id}')" class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-2xl text-sm font-black transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                                    <i data-lucide="clock" class="w-4 h-4"></i> 重新激活願望
                                </button>
                            `}
                        </div>
                    `;
                }).join('');
                
                if (window.lucide) lucide.createIcons();
            } catch (err) {
                console.error('Error rendering list:', err);
            }
        }

        // --- Helper Functions ---

        function setStatusFilter(filter) {
            currentStatusFilter = filter;
            document.querySelectorAll('.status-btn').forEach(btn => {
                const isActive = btn.dataset.filter === filter;
                btn.className = `status-btn px-3 py-1.5 rounded-lg text-xs font-black transition-all uppercase tracking-wider flex items-center gap-1.5 ${isActive ? 'bg-white text-amber-900 shadow-sm' : 'text-amber-900/40 hover:text-amber-900/60'}`;
                const span = btn.querySelector('span');
                span.className = isActive ? 'bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-md text-[10px]' : 'bg-amber-900/5 text-amber-900/40 px-1.5 py-0.5 rounded-md text-[10px]';
            });
            renderList();
        }

        function setCategoryFilter(cat) {
            currentCategoryFilter = cat;
            renderCategories();
            renderList();
        }

        function renderCategories() {
            const container = document.getElementById('category-filters');
            container.innerHTML = CATEGORIES.map(cat => `
                <button onclick="setCategoryFilter('${cat.label}')" class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-all ${currentCategoryFilter === cat.label ? 'bg-amber-900 text-white shadow-md shadow-amber-200' : 'bg-white text-amber-900 hover:bg-amber-100 border border-amber-100'}">
                    <i data-lucide="${cat.icon}" class="w-4 h-4"></i> ${cat.label}
                </button>
            `).join('');
            lucide.createIcons();
        }

        function renderModalCategories() {
            const container = document.getElementById('modal-categories');
            container.innerHTML = CATEGORIES.filter(c => c.label !== '全部').map(cat => `
                <button type="button" onclick="selectModalCategory('${cat.label}')" class="px-4 py-2 rounded-2xl text-sm font-bold transition-all ${selectedModalCategory === cat.label ? 'bg-amber-400 text-white shadow-lg shadow-amber-200' : 'bg-amber-50 text-amber-900/60 hover:bg-amber-100'}">
                    ${cat.label}
                </button>
            `).join('');
        }

        function selectModalCategory(cat) {
            selectedModalCategory = cat;
            renderModalCategories();
        }

        function toggleStatus(id) {
            const records = loadData();
            const record = records.find(r => r.id === id);
            if (record) {
                record.status = record.status === 'active' ? 'done' : 'active';
                localStorage.setItem('records', JSON.stringify(records));
                syncToSheet({ action: "update", id: id, changes: { status: record.status } });
                renderList();
            }
        }

        function deleteRecord(id) {
            if (!confirm('確定要刪除這個願望嗎？')) return;
            const records = loadData();
            const filtered = records.filter(r => r.id !== id);
            localStorage.setItem('records', JSON.stringify(filtered));
            // ✅ 新增這一行，將刪除操作同步到 Google Sheet
            syncToSheet({ action: "delete", id: id });
            renderList();
        }

        function openModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('wish-form').reset();
            selectedModalCategory = '學業';
            renderModalCategories();
        }

        function openReportModal(id) {
            document.getElementById('report-wish-id').value = id;
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.add('hidden');
            document.getElementById('report-form').reset();
        }

        function toggleEmojiPicker(target) {
            const picker = document.getElementById(`emoji-picker-${target}`);
            picker.classList.toggle('active');
            if (picker.innerHTML === '') {
                picker.innerHTML = EMOJIS.map(e => `<button type="button" onclick="addEmoji('${target}', '${e}')" class="text-xl hover:bg-amber-50 p-1 rounded-lg">${e}</button>`).join('');
            }
        }

        function addEmoji(targetId, emoji) {
            let inputId = targetId === 'report' ? 'report-content' : `wish-${targetId}`;
            const input = document.getElementById(inputId);
            input.value += emoji;
            document.getElementById(`emoji-picker-${targetId}`).classList.remove('active');
        }

        // --- Event Listeners ---

        document.getElementById('wish-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('wish-title').value;
            const content = document.getElementById('wish-content').value;
            
            const newRecord = {
                id: Date.now() + "_" + Math.random().toString(36).slice(2, 6),
                createdAt: new Date().toISOString(),
                title: title,
                content: content,
                category: selectedModalCategory,
                status: "active",
                updates: []
            };

            saveData(newRecord);
            closeModal();
            renderList();
        });

        document.getElementById('report-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const wishId = document.getElementById('report-wish-id').value;
            const content = document.getElementById('report-content').value;
            
            const records = loadData();
            const record = records.find(r => r.id === wishId);
            if (record) {
                record.updates = record.updates || [];
                record.updates.push({
                    id: Date.now() + "_" + Math.random().toString(36).slice(2, 6),
                    content: content,
                    createdAt: new Date().toISOString()
                });
                localStorage.setItem('records', JSON.stringify(records));
                syncToSheet({ action: "update", id: wishId, changes: { updates: record.updates } });
                closeReportModal();
                renderList();
            }
        });

        // --- Initialization ---
        window.onload = () => {
            renderCategories();
            renderModalCategories();
            renderList();
            lucide.createIcons();
        };
    </script>
</body>
</html>
